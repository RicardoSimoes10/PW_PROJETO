<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/information.js"></script>
    <script src="scripts/main.js"></script>
</head>

<body>
    <header class="mainHeader">
        <nav class="mainNav">
            <div class="logo">
                <a href="index.html">TaskHub</a>
            </div>
            <div class="navLinks">
                <ul>
                    <li><a href="javascript: info.showTasks();">Tarefas</a></li>
                </ul>
            </div>
        </nav>
    </header>
    
    <main id="mainInformation" class="container">
        <h1>Lista de Tarefas</h1>
        <div class="inputContainer">
            <input type="text" id="taskInput" placeholder="Nova tarefa ...">
            <button onclick="info.addTasks();" class="addTaskButton" type="button" title="Adicionar Tarefa">&#43;</button>
        </div>
        <div id="taskListDivInformation" class="taskList">
            <ul>
                <li>
                    <label>Tarefa 1</label>
                    <div id="editRemoveButtonsDiv">
                        <button onclick="info.updateTasks();" class="editTaskButton" type="button" title="Editar Tarefa">&#9998;</button>
                        <button onclick="info.removeTasks();" class="removeTaskButton" type="button" title="Remover Tarefa">&#x2715;</button>
                    </div>
                </li>
                <li>
                    <label>Tarefa 2</label>
                    <div>
                        <button onclick="info.updateTasks();" class="editTaskButton" type="button" title="Editar Tarefa">&#9998;</button>
                        <button onclick="info.removeTasks();" class="removeTaskButton" type="button" title="Remover Tarefa">&#x2715;</button>
                    </div>
                </li>
                <li>
                    <label>Tarefa 3</label>
                    <div>
                        <button onclick="info.updateTasks();" class="editTaskButton" type="button" title="Editar Tarefa">&#9998;</button>
                        <button onclick="info.removeTasks();" class="removeTaskButton" type="button" title="Remover Tarefa">&#x2715;</button>
                    </div>
                </li>
            </ul>
        </div>
    </main>
</body>

</html>
