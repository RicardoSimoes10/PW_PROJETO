<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/tarefa.js"></script>
    <script src="scripts/information.js"></script>
    <script src="scripts/main.js"></script>
</head>

<body>
    <header class="mainHeader">
        <nav class="mainNav">
            <div class="logo">
                <a href="index.html">TaskHub</a>
            </div>
            <div class="navLinks">
                <ul>
                    <li><a href="javascript: info.showTasks();">Tarefas</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="backGround"></div>
    <!--ADD FORM-->
    <form id="addForm" class="addFormContainer" onsubmit="info.addTasks();">
        <h1 id="tarefaTitle">Adicionar Tarefa</h1>
        <div class="inputContainer">
            <input type="text" id="taskInput" placeholder="Nova tarefa ...">
            <button id="taskButton" class="addTaskButton" type="submit" title="Adicionar Tarefa">&#43;</button>
        </div>
        <input type="date" id="taskDate">
    </form>
    <!--EDIT FORM-->
    <form id="editForm" class="editFormContainer" onsubmit="info.updateTasks(editTaskId.value);">
        <h1 id="tarefaTitle">Editar Tarefa</h1>
        <div class="inputContainer">
            <input type="text" id="editTaskInput" placeholder="Editar tarefa ...">
            <button id="editTaskButton" class="addTaskButton" type="submit" title="Editar Tarefa">&#10003;</button>
        </div>
        <input type="date" id="editTaskDate">
    </form>
    <!--SHOW TASKS-->
    <main id="mainInformation" class="container">
        <h1 id="tituloListaTarefas" class="tituloTarefas">Lista de Tarefas</h1>
        <div id="taskListDivInformation" class="taskList">
            <div id="information"></div>
        </div>
    </main>
    <footer class="footer"></footer>
    <input type="hidden" id="editTaskId">
</body>

</html>
